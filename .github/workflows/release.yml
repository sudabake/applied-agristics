name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 1.3.1 或 1.3.2-beta.1'
        required: true
        type: string
      release_type:
        description: '发行类型'
        required: true
        type: choice
        options: [release, beta, alpha]
        default: release
      target:
        description: '上传平台'
        required: true
        type: choice
        options: [all, github, curseforge, modrinth]
        default: all
      dry_run:
        description: '仅测试并生成下载包，取消勾选才正式上传'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'sudabake/applied-agristics'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      release_type: ${{ steps.prepare.outputs.release_type }}
      platforms: ${{ steps.prepare.outputs.platforms }}
      curseforge_id: ${{ steps.prepare.outputs.curseforge_id }}
      modrinth_id: ${{ steps.credentials.outputs.modrinth_id || steps.prepare.outputs.modrinth_id }}
      dependencies: ${{ steps.prepare.outputs.dependencies }}
      minecraft: ${{ steps.prepare.outputs.minecraft }}
      loader: ${{ steps.prepare.outputs.loader }}
      java: ${{ steps.prepare.outputs.java }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check version, source and release notes
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 tools/release.py prepare
      - name: Check upload credentials and project access
        id: credentials
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_PLATFORMS: ${{ steps.prepare.outputs.platforms }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 tools/release.py credentials

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dependencies: [latest, minimum]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ needs.prepare.outputs.java }}
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Check resource and release tooling
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/check_resource_rebuild.py
      - name: Build and run game tests
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DEPENDENCY_PROFILE: ${{ matrix.dependencies }}
        shell: bash
        run: |
          set -euo pipefail
          args=("-Pmod_version=$RELEASE_VERSION" "-Prelease_name=$RELEASE_VERSION")
          if [[ "$DEPENDENCY_PROFILE" == minimum ]]; then
            args+=(-Pneo_version=21.1.241 -Pae2_version=19.2.17 -Pma_version=8.0.27 -Pguideme_version=21.1.17)
          fi
          bash gradlew build runGameTestServer "${args[@]}"
          python3 tools/resource_audit.py --jar "build/libs/applied-agristics-$RELEASE_VERSION.jar"
      - name: Prepare the shared publication files
        if: matrix.dependencies == 'latest'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
        run: python3 tools/release.py bundle
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: matrix.dependencies == 'latest'
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: build/publication/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, verify]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: build/publication/
      - name: Verify shared files before uploading
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 tools/release.py verify
      - name: Upload to ${{ matrix.platform }}
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          files: build/publication/applied-agristics-${{ needs.prepare.outputs.version }}.jar
          name: Applied Agristics 应用农业 ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}
          version-type: ${{ needs.prepare.outputs.release_type }}
          changelog-file: build/publication/release-notes.md
          loaders: ${{ needs.prepare.outputs.loader }}
          game-versions: ${{ needs.prepare.outputs.minecraft }}
          java: ${{ needs.prepare.outputs.java }}
          environment: client | server
          retry-attempts: 1
          fail-mode: fail
          github-token: ${{ matrix.platform == 'github' && secrets.GITHUB_TOKEN || '' }}
          github-tag: v${{ needs.prepare.outputs.version }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: false
          github-files: |
            build/publication/applied-agristics-${{ needs.prepare.outputs.version }}.jar
            build/publication/applied-agristics-${{ needs.prepare.outputs.version }}-source.zip
            build/publication/SHA256SUMS.txt
          curseforge-id: ${{ matrix.platform == 'curseforge' && needs.prepare.outputs.curseforge_id || '' }}
          curseforge-token: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          curseforge-dependencies: ${{ fromJSON(needs.prepare.outputs.dependencies).curseforge }}
          modrinth-id: ${{ matrix.platform == 'modrinth' && needs.prepare.outputs.modrinth_id || '' }}
          modrinth-token: ${{ matrix.platform == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          modrinth-dependencies: ${{ fromJSON(needs.prepare.outputs.dependencies).modrinth }}
