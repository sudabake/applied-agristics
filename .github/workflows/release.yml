name: Publish release

on:
  push:
    branches: [port/forge-1.20.1]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      version:
        description: Source mod version
        required: true
        default: '1.4.0'
        type: string
      release_type:
        description: Release type
        required: true
        default: beta
        type: choice
        options: [beta]
      target:
        description: Platforms
        required: true
        default: github-curseforge
        type: choice
        options: [github-curseforge, github, curseforge]
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: forge-1.20.1-publication
  cancel-in-progress: false

env:
  RELEASE_NOTES: docs/FORGE_1.20.1_RELEASE_NOTES.md

jobs:
  verify:
    if: github.repository == 'sudabake/applied-agristics' && github.ref == 'refs/heads/port/forge-1.20.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dry_run: ${{ steps.request.outputs.dry_run }}
      platforms: ${{ steps.request.outputs.platforms }}
      release_name: ${{ steps.request.outputs.release_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check release inputs
        id: request
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TYPE: ${{ inputs.release_type }}
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            REQUESTED_VERSION=$(jq -er '.version | strings' .github/release-request.json)
            REQUESTED_TYPE=$(jq -er '.type | strings' .github/release-request.json)
            REQUESTED_TARGET=$(jq -er '.target | strings' .github/release-request.json)
            REQUESTED_DRY_RUN=$(jq -er '.dry_run | booleans | tostring' .github/release-request.json)
          fi
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$REQUESTED_TYPE" = beta
          release_name="$REQUESTED_VERSION-forge-1.20.1"
          grep -Fxq "mod_version=$REQUESTED_VERSION" gradle.properties
          grep -Fxq "release_name=$release_name" gradle.properties
          case "$REQUESTED_DRY_RUN" in true|false) ;; *) exit 1 ;; esac
          case "$REQUESTED_TARGET" in
            github-curseforge) platforms='["github","curseforge"]' ;;
            github) platforms='["github"]' ;;
            curseforge) platforms='["curseforge"]' ;;
            *) exit 1 ;;
          esac
          if [[ "$REQUESTED_DRY_RUN" == false && "$REQUESTED_TARGET" != curseforge ]]; then
            tags=$(git ls-remote --tags origin "refs/tags/v$release_name")
            test -z "$tags"
          fi
          printf 'dry_run=%s\nplatforms=%s\nrelease_name=%s\n' "$REQUESTED_DRY_RUN" "$platforms" "$release_name" >> "$GITHUB_OUTPUT"
      - name: Check CurseForge API credentials
        if: steps.request.outputs.dry_run == 'false' && contains(fromJSON(steps.request.outputs.platforms), 'curseforge')
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_TOKEN"
          curl --silent --show-error --fail --max-time 30 \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" https://minecraft.curseforge.com/api/game/versions >/dev/null
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Verify and bundle Forge files
        env:
          RELEASE_NAME: ${{ steps.request.outputs.release_name }}
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/check_resource_rebuild.py
          bash gradlew build runGameTestServer -Prelease_name="$RELEASE_NAME"
          jar="applied-agristics-$RELEASE_NAME.jar"
          python3 tools/resource_audit.py --jar "build/libs/$jar"
          mkdir -p build/forge-publication
          cp "build/libs/$jar" build/forge-publication/
          cd build/forge-publication
          sha256sum "$jar" > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: forge-1.20.1-publication
          path: build/forge-publication/
          if-no-files-found: error

  publish:
    needs: verify
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_NAME: ${{ needs.verify.outputs.release_name }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.verify.outputs.platforms) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: forge-1.20.1-publication
          path: build/forge-publication/
      - name: Verify JAR checksum
        working-directory: build/forge-publication
        run: sha256sum -c SHA256SUMS.txt
      - name: Upload Forge beta
        id: upload
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          files: build/forge-publication/applied-agristics-${{ env.RELEASE_NAME }}.jar
          name: applied-agristics-${{ env.RELEASE_NAME }}.jar
          version: ${{ env.RELEASE_NAME }}
          version-type: beta
          changelog-file: ${{ env.RELEASE_NOTES }}
          loaders: forge
          game-versions: '1.20.1'
          java: '17'
          environment: client | server
          retry-attempts: 1
          fail-mode: fail
          github-token: ${{ matrix.platform == 'github' && secrets.GITHUB_TOKEN || '' }}
          github-tag: v${{ env.RELEASE_NAME }}
          github-commitish: ${{ github.sha }}
          github-prerelease: true
          github-generate-changelog: false
          github-files: |
            build/forge-publication/applied-agristics-${{ env.RELEASE_NAME }}.jar
            build/forge-publication/SHA256SUMS.txt
          curseforge-id: ${{ matrix.platform == 'curseforge' && '1772431' || '' }}
          curseforge-token: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
          curseforge-dependencies: |
            applied-energistics-2(required)
            mystical-agriculture(required)
      - name: Record publication
        env:
          PLATFORM: ${{ matrix.platform }}
          FILES: ${{ steps.upload.outputs[format('{0}-files', matrix.platform)] }}
          URL: ${{ steps.upload.outputs[format('{0}-url', matrix.platform)] }}
        run: |
          test -n "$FILES"
          test -n "$URL"
          printf '%s\n\n%s\n\n%s\n' "$PLATFORM" "$URL" "$FILES" >> "$GITHUB_STEP_SUMMARY"
