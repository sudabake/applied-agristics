name: Build and game tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Test portable resource exports
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check isolated resource rebuild
        run: python3 tools/check_resource_rebuild.py
      - name: Build and unit tests
        run: bash gradlew build
      - name: Forge game tests
        run: bash gradlew runGameTestServer
